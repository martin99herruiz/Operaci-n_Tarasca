<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captura Pick-Up</title>
  <base href="/">
  <script type="importmap">
  {
    "imports": {
      "three": "../../libs/three.module.js"
    }
  }
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f4eb;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three'
    import { Abanico } from '../../pick-ups/Abanico.js'
    import { Farolillo } from '../../pick-ups/Farolillo.js'
    import { Castanuelas } from '../../pick-ups/Castanuelas.js'
    import { Rebujito } from '../../pick-ups/Rebujito.js'

    const params = new URLSearchParams(window.location.search)
    const objName = (params.get('obj') || 'abanico').toLowerCase()

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.outputColorSpace = THREE.SRGBColorSpace
    document.body.appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xf8f4eb)

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 120)

    const ambient = new THREE.AmbientLight(0xffffff, 0.72)
    scene.add(ambient)

    const key = new THREE.DirectionalLight(0xfff6e8, 1.2)
    key.position.set(3.2, 4.8, 2.6)
    scene.add(key)

    const fill = new THREE.DirectionalLight(0xe0ecff, 0.45)
    fill.position.set(-2.6, 2.2, -1.9)
    scene.add(fill)

    const front = new THREE.PointLight(0xffffff, 0.85, 20)
    front.position.set(0.4, 1.35, 2.2)
    scene.add(front)

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(4.2, 64),
      new THREE.MeshStandardMaterial({
        color: 0xe7ddcb,
        roughness: 0.92,
        metalness: 0.0
      })
    )
    floor.rotation.x = -Math.PI / 2
    floor.position.y = -0.66
    floor.receiveShadow = true
    scene.add(floor)

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.66, 0.74, 0.2, 48),
      new THREE.MeshStandardMaterial({
        color: 0xd8c8aa,
        roughness: 0.84
      })
    )
    pedestal.position.y = -0.56
    const usePedestal = objName === 'abanico'
    if (usePedestal) {
      scene.add(pedestal)
    }

    let object3d
    let initialRotationY = -0.5
    switch (objName) {
      case 'farolillo':
        object3d = new Farolillo()
        object3d.position.set(0, 0.12, 0)
        initialRotationY = -0.48
        break
      case 'castanuelas':
        object3d = new Castanuelas()
        object3d.position.set(0, 0.52, 0)
        initialRotationY = -0.42
        break
      case 'rebujito':
        object3d = new Rebujito()
        object3d.position.set(0, 0.26, 0)
        initialRotationY = -0.52
        break
      case 'abanico':
      default:
        object3d = new Abanico()
        object3d.position.set(0, 0.15, 0)
        initialRotationY = 1.08
        break
    }

    if (typeof object3d.setRotacionActiva === 'function') {
      object3d.setRotacionActiva(false)
    }
    if (typeof object3d.setAnimacionActiva === 'function') {
      object3d.setAnimacionActiva(false)
    }
    if (typeof object3d.setApertura === 'function') {
      object3d.setApertura(2.65)
    }
    if (typeof object3d.setNivelLiquido === 'function') {
      object3d.setNivelLiquido(0.74)
    }

    object3d.rotation.y = initialRotationY
    scene.add(object3d)

    fitCameraToObject(camera, object3d)

    const clock = new THREE.Clock()
    const animate = () => {
      requestAnimationFrame(animate)
      const delta = clock.getDelta()
      if (object3d && typeof object3d.update === 'function') {
        object3d.update(delta)
      }
      renderer.render(scene, camera)
    }
    animate()

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    function fitCameraToObject(cam, object) {
      object.updateMatrixWorld(true)
      const box = new THREE.Box3().setFromObject(object)
      const size = new THREE.Vector3()
      const center = new THREE.Vector3()
      box.getSize(size)
      box.getCenter(center)

      const maxDim = Math.max(size.x, size.y, size.z)
      const fov = THREE.MathUtils.degToRad(cam.fov)
      let distance = (maxDim * 0.72) / Math.tan(fov * 0.5)
      const distanceScale = objName === 'abanico' ? 1.18 : 1.45
      distance *= distanceScale

      const viewDirection = new THREE.Vector3(1.05, 0.62, 1.22).normalize()
      cam.position.copy(center.clone().addScaledVector(viewDirection, distance))
      cam.near = Math.max(0.01, distance / 200)
      cam.far = distance * 20
      cam.lookAt(center.x, center.y + size.y * 0.06, center.z)
      cam.updateProjectionMatrix()
    }
  </script>
</body>
</html>
