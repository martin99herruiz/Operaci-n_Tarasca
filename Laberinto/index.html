<!DOCTYPE html>
<html>
<head>
    <title>Operación Tarasca</title>
    <meta charset="utf-8">
    <script type="text/javascript" src="../libs/jquery.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "../libs/three.module.js",
        "gui": "../libs/dat.gui.module.js",
        "trackball": "../libs/TrackballControls.js"
      }
    }
    </script>

    <script type="module" src="./MyScene.js?v=feria-40"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #2d353b;
        }

        #Hud {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            align-items: center;
            color: white;
            font-size: 15px;
            line-height: 1;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        }

        #Hud strong {
            font-size: 18px;
            font-weight: 700;
        }

        #HudMessage {
            min-width: 210px;
            opacity: 0.9;
        }

        #Crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 10;
            width: 14px;
            height: 14px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="Hud">
        <strong id="PickupCounter">0/4</strong>
        <span id="HudMessage">Operación Tarasca</span>
    </div>
    <div id="Crosshair"></div>
    <div id="EndScreen" style="display:none;">
        <div class="end-box">
            <p id="EndScreenMessage"></p>
            <button id="RestartButton">Empezar de nuevo</button>
        </div>
    </div>
    <div id="WebGL-output"></div>
    <style>
        #EndScreen{
            position:fixed;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            background:rgba(0,0,0,0.55);
            z-index:50;
            pointer-events:auto;
        }
        #EndScreen .end-box{
            background:linear-gradient(180deg,#2b2b2b,#111);
            color:#fff;
            padding:28px 32px;
            border-radius:10px;
            box-shadow:0 8px 24px rgba(0,0,0,0.6);
            text-align:center;
            max-width:420px;
        }
        #EndScreen p{ margin:0 0 18px; font-size:18px; }
        #RestartButton{
            background:#e74c3c;
            color:#fff;
            border:0;
            padding:10px 18px;
            border-radius:6px;
            cursor:pointer;
            font-weight:700;
        }
        #RestartButton:hover{ filter:brightness(1.05); }
    </style>
</body>
</html>
